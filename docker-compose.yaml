services:
  postgres:
    image: postgres:16-alpine
    container_name: college-postgres
    environment:
      POSTGRES_DB: college
      POSTGRES_USER: college
      POSTGRES_PASSWORD: college
      POSTGRES_HOST_AUTH_METHOD: trust  # dev-only, avoids password issues
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U college"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
