<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="90" fill="#0ea5e9" opacity="0.1"/>
  
  <!-- Compass/Guidepost Icon -->
  <g transform="translate(100, 100)">
    <!-- Center point -->
    <circle cx="0" cy="0" r="8" fill="#0ea5e9"/>
    
    <!-- North arrow -->
    <path d="M 0 -60 L -12 -35 L 0 -40 L 12 -35 Z" fill="#0ea5e9"/>
    
    <!-- Compass points -->
    <line x1="0" y1="-70" x2="0" y2="-25" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round"/>
    <line x1="70" y1="0" x2="25" y2="0" stroke="#0ea5e9" stroke-width="2" opacity="0.5"/>
    <line x1="0" y1="70" x2="0" y2="25" stroke="#0ea5e9" stroke-width="2" opacity="0.5"/>
    <line x1="-70" y1="0" x2="-25" y2="0" stroke="#0ea5e9" stroke-width="2" opacity="0.5"/>
    
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="75" stroke="#0ea5e9" stroke-width="2" fill="none" opacity="0.3"/>
  </g>
  
  <!-- Text -->
  <text x="100" y="180" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#0ea5e9" text-anchor="middle">
    Guidepost
  </text>
</svg>
