services:
  postgres:
    image: postgres:16-alpine
    container_name: guidepost-postgres
    environment:
      POSTGRES_DB: college
      POSTGRES_USER: college
      POSTGRES_PASSWORD: college
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U college -d college"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
